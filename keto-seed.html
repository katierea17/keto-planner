<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Keto Data Fix</title>
<style>
  body { background: #0f0f0f; color: #e8e8e8; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 16px; padding: 40px; }
  button { background: #1f2e1f; border: 1px solid #2d4a2d; color: #7ecb7e; font-size: 1.1rem; font-weight: 600; padding: 16px 40px; border-radius: 10px; cursor: pointer; margin: 4px; }

  a { color: #7eaaef; font-size: 1rem; }
  b.ok { color: #7ecb7e; } b.err { color: #e05555; }
</style>
</head>
<body>
<h2 style="color:#f0f0f0">Keto Data</h2>

<div id="log">Click the button to save your data.</div>
<script>

  var days = {

        {instanceId:6,  foodId:'e-cheddar-2sl',     qty:1, sizeIndex:1, eaten:true, servings:1,   override:{name:'Tillamook Sharp Cheddar', desc:'2 slices Tillamook sharp cheddar',                                      cal:220, carb:0,  protein:14, fat:18}},
        {instanceId:7,  foodId:'e-walnuts',         qty:1, sizeIndex:1, eaten:true, servings:0.5, override:{name:'Small Handful of Walnuts',desc:'~1 oz walnuts',                                                         cal:185, carb:2,  protein:4,  fat:18}},
        {instanceId:8,  foodId:'s-deli-turkey',     qty:1, sizeIndex:1, eaten:true, servings:0.5, override:{name:'Deli Turkey (2 slices)',  desc:'2 slices deli turkey breast',                                           cal:50,  carb:1,  protein:10, fat:0.5}},

        {instanceId:10, foodId:'m-keto-salad',      qty:1, sizeIndex:1, eaten:true, servings:1,   override:{name:'Keto Salad',              desc:'Kale · Mexican cheese · 8 slivers red onion · 5 olives · olive oil, ACV, lemon, garlic', cal:367, carb:6, protein:10, fat:33}},
        {instanceId:11, foodId:'m-fried-cauliflower',qty:1,sizeIndex:1, eaten:true, servings:1,   override:{name:'Fried Cauliflower',       desc:'1 cup cauliflower in egg batter, pan-fried',                            cal:225, carb:6,  protein:8,  fat:20}},
        {instanceId:12, foodId:'m-beef-zucchini',   qty:1, sizeIndex:1, eaten:true, servings:1,   override:{name:'Ground Beef & Zucchini',  desc:'4 oz ground beef · ½ oz zucchini · ½ oz red onion · ½ oz shredded cheese', cal:350, carb:2, protein:24, fat:28}},

        {instanceId:1, foodId:'b-standard',         qty:1, sizeIndex:1, eaten:false, servings:1, override:{name:'Standard Breakfast',       desc:'2-3 eggs · 2 oz smoked salmon · cream cheese · capers',                cal:380, carb:2,  protein:35, fat:24}},

  };

  Object.keys(days).forEach(function(dateStr) {
    var d = days[dateStr];
    localStorage.setItem('keto-day-' + dateStr, JSON.stringify(d.data));
    var check = localStorage.getItem('keto-day-' + dateStr);
    log.innerHTML += d.label + ': <b class="' + (check ? 'ok' : 'err') + '">' + (check ? check.length + ' bytes ✓' : 'FAILED') + '</b> — ' + d.summary + '<br>';

  log.innerHTML += '<br><a href="/keto-planner.html">✓ Open planner</a>';

</script>
</body>
</html>
